<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADS - Computer-Aided Design Storage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e94560'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="modulepreload" href="vendor/three.js">
    <link rel="preload" href="designs.json" as="fetch" crossorigin="anonymous">
</head>
<body>
    <header>
        <h1>CADS</h1>
        <p class="subtitle">Computer-Aided Design Storage</p>
        <nav>
            <a href="index.html" class="active">Gallery</a>
            <a href="editor.html">Editor</a>
        </nav>
    </header>

    <main>
        <div class="gallery-controls">
            <input type="search" id="search-input" class="search-input"
                   placeholder="Search designs&hellip;" aria-label="Search designs">
            <div id="tag-filter" class="tag-filter" hidden>
                <!-- Tag filter buttons populated by JS -->
            </div>
        </div>
        <section id="gallery" class="gallery">
            <!-- Design cards are populated by JS -->
            <div class="loading">Loading designs&hellip;</div>
        </section>
    </main>

    <footer>
        <p>Powered by <a href="https://openscad.org" target="_blank">OpenSCAD</a> &amp;
        <a href="https://threejs.org" target="_blank">Three.js</a></p>
    </footer>

    <script type="module" src="js/gallery.js"></script>
</body>
</html>
