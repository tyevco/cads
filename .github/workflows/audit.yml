name: Audit Designs

on:
  pull_request:
    paths:
      - 'designs/**'
      - 'macros/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Renders every _display_mode of every design and validates the
      # meshes (watertight, no degenerate triangles, no OpenSCAD
      # errors/warnings). Nonzero exit fails the check.
      - name: Audit designs
        env:
          AUDIT_TIMEOUT: '480'
        run: xvfb-run ./scripts/audit_designs.sh
